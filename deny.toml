[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
