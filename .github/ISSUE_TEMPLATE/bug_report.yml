name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected, and the exact command.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rax doctor --json`
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RAX version or commit
    validations:
      required: true
